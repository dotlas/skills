# Lefthook configuration.
#
# References:
#
# - [Documentation](https://github.com/evilmartians/lefthook)

output = [
  # "meta",          # Print lefthook version
  "summary",       # Print summary block (successful and failed steps)
  "empty_summary", # Print summary heading when there are no steps to run
  "success",       # Print successful steps
  "failure",       # Print failed steps printing
  "execution",     # Print any execution logs
  # "execution_out",  # Print execution output
  # "execution_info", # Print `EXECUTE > ...` logging
  "skips", # Print "skip" (i.e. no files matched)
]

# Sync the default uv venv after checkout and merge so the dev tooling
# (flowmark, lefthook) stays installed in `.venv` without a manual step.
[post-checkout.commands.sync]
run = "uv sync"

[post-merge.commands.sync]
run = "uv sync"

# Auto-format Markdown before commit, restaging whatever flowmark rewrites.
[pre-commit.commands.flowmark]
glob = "*.{md,mdx}"
run = "uv run flowmark --inplace --nobackup {staged_files}"
stage_fixed = true
